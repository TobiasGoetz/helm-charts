name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  pages: write
  id-token: write
  actions: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Get GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Enable auto-merge on release PRs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          echo "$PRS" | jq -r '.[].number' | while read -r pr_number; do
            echo "Enabling auto-merge on release PR #${pr_number}"
            gh pr merge --repo "$GITHUB_REPOSITORY" --auto --squash "$pr_number"
          done

  helm-publish:
    needs: release-please
    if: needs.release-please.outputs.paths_released != '' && needs.release-please.outputs.paths_released != '[]'
    uses: ./.github/workflows/helm-publish.yml
    with:
      paths: ${{ needs.release-please.outputs.paths_released }}
