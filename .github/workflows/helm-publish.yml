name: "Helm Publish"

permissions:
  contents: write
  packages: write

on:
  workflow_call:
    inputs:
      paths:
        description: JSON array of released chart paths
        type: string
        required: true
  workflow_dispatch:
    inputs:
      paths:
        description: 'JSON array of chart paths, e.g. ["charts/blocky"]'
        type: string
        required: true
        default: '[]'

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(inputs.paths) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: "v3.14.0"

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Package and push chart
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          chartPath="${{ matrix.chart }}"
          helm package "$chartPath"
          name=$(basename "$chartPath")
          version=$(awk '/^version:/ { print $2; exit }' "$chartPath/Chart.yaml" | tr -d '"')
          ref="ghcr.io/${OWNER}/helm-charts/${name}"
          helm push "${name}-${version}.tgz" "oci://ghcr.io/${OWNER}/helm-charts"
          crane tag "${ref}:${version}" latest

  publish-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: "v3.14.0"

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_only: true

      - name: Ensure gh-pages branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages; then
            echo "gh-pages already exists"
          else
            current=$(git rev-parse HEAD)
            git checkout --orphan gh-pages
            git reset --hard
            git commit --allow-empty -m "Initialize gh-pages"
            git push origin gh-pages
            git checkout --force "$current"
          fi
          git fetch origin gh-pages:refs/remotes/origin/gh-pages


      - name: Package charts
        run: |
          set -euo pipefail
          mkdir -p .cr-release-packages
          echo '${{ inputs.paths }}' | jq -r '.[]' | while read -r chartPath; do
            echo "Packaging $chartPath"
            helm package "$chartPath" -d .cr-release-packages
          done
          ls -la .cr-release-packages

      - name: Upload packages and publish index to GitHub Pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          repo="${GITHUB_REPOSITORY#*/}"
          # cr index only adds charts that exist as .tgz assets on GitHub Releases
          cr upload \
            --owner "$owner" \
            --git-repo "$repo" \
            --package-path .cr-release-packages \
            --release-name-template "{{ .Name }}-v{{ .Version }}" \
            --skip-existing
          cr index \
            --owner "$owner" \
            --git-repo "$repo" \
            --pages-branch gh-pages \
            --package-path .cr-release-packages \
            --packages-with-index \
            --release-name-template "{{ .Name }}-v{{ .Version }}" \
            --push
