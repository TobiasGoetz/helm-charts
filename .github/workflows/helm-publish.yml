name: "Helm Publish"

permissions:
  contents: write
  packages: write

on:
  workflow_call:
    inputs:
      paths:
        description: JSON array of released chart paths
        type: string
        required: true
  workflow_dispatch:
    inputs:
      paths:
        description: 'JSON array of chart paths, e.g. ["charts/blocky"]'
        type: string
        required: true
        default: '[]'

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(inputs.paths) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: "v3.14.0"

      - name: Package chart
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(basename "${{ matrix.chart }}")
          version=$(awk '/^version:/ { print $2; exit }' "${{ matrix.chart }}/Chart.yaml" | tr -d '"')
          mkdir -p helm-packages
          helm package "${{ matrix.chart }}" -d helm-packages
          package="helm-packages/${name}-${version}.tgz"
          ls -la helm-packages
          echo "Uploading ${package} to release ${name}-v${version}"
          gh release upload "${name}-v${version}" "$package" --clobber
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload chart package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-package-${{ steps.package.outputs.name }}
          path: helm-packages/*.tgz
          if-no-files-found: error

  publish-oci:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(inputs.paths) }}
    steps:
      - name: Resolve chart name
        id: chart
        run: echo "name=$(basename "${{ matrix.chart }}")" >> "$GITHUB_OUTPUT"

      - name: Download chart package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chart-package-${{ steps.chart.outputs.name }}
          path: helm-packages

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: "v3.14.0"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Push chart
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          name="${{ steps.chart.outputs.name }}"
          shopt -s nullglob
          packages=(helm-packages/"${name}"-*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "expected exactly one package for ${name}, found: ${packages[*]-none}"
            exit 1
          fi
          helm push "${packages[0]}" "oci://ghcr.io/${OWNER}/helm-charts"

  publish-pages:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Download chart packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: chart-package-*
          path: helm-packages
          merge-multiple: true

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_only: true

      - name: Publish index to GitHub Pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .cr-index
          mkdir -p .cr-index
          cr index \
            --owner "${{ github.repository_owner }}" \
            --git-repo "${GITHUB_REPOSITORY#*/}" \
            --pages-branch gh-pages \
            --package-path helm-packages \
            --release-name-template "{{ .Name }}-v{{ .Version }}" \
            --push
