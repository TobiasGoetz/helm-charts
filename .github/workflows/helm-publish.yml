name: "Helm Publish"

permissions:
  contents: read
  packages: write

on:
  workflow_call:
    inputs:
      paths:
        description: JSON array of released chart paths
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(inputs.paths) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: "v3.14.0"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Package and push chart
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          chartPath="${{ matrix.chart }}"
          helm package "$chartPath"
          name=$(basename "$chartPath")
          version=$(awk '/^version:/ { print $2; exit }' "$chartPath/Chart.yaml" | tr -d '"')
          helm push "${name}-${version}.tgz" "oci://ghcr.io/${OWNER}/helm-charts"
