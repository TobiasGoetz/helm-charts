name: "Helm Publish"

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  actions: write

on:
  workflow_call:
    inputs:
      paths:
        description: JSON array of released chart paths
        type: string
        required: true
  workflow_dispatch:
    inputs:
      paths:
        description: 'JSON array of chart paths, e.g. ["charts/blocky"]'
        type: string
        required: true
        default: '[]'

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(inputs.paths) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: "v4.2.4"

      - name: Package chart
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(basename "${{ matrix.chart }}")
          version=$(awk '/^version:/ { print $2; exit }' "${{ matrix.chart }}/Chart.yaml" | tr -d '"')
          mkdir -p helm-packages
          helm package "${{ matrix.chart }}" -d helm-packages
          package="helm-packages/${name}-${version}.tgz"
          ls -la helm-packages
          echo "Uploading ${package} to release ${name}-v${version}"
          gh release upload "${name}-v${version}" "$package" --clobber
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload chart package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-package-${{ steps.package.outputs.name }}
          path: helm-packages/*.tgz
          if-no-files-found: error

  publish-oci:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(inputs.paths) }}
    steps:
      - name: Resolve chart name
        id: chart
        run: echo "name=$(basename "${{ matrix.chart }}")" >> "$GITHUB_OUTPUT"

      - name: Download chart package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-package-${{ steps.chart.outputs.name }}
          path: helm-packages

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: "v4.2.4"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Push chart
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          name="${{ steps.chart.outputs.name }}"
          shopt -s nullglob
          packages=(helm-packages/"${name}"-*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "expected exactly one package for ${name}, found: ${packages[*]-none}"
            exit 1
          fi
          helm push "${packages[0]}" "oci://ghcr.io/${OWNER}/helm-charts"

  publish-pages:
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: "v4.2.4"

      - name: Restore chart package cache
        id: chart-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/*.tgz
          key: helm-pages-charts-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            helm-pages-charts-

      - name: Download new chart packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: chart-package-*
          path: new-packages
          merge-multiple: true

      - name: Detect cache state
        id: cache-state
        run: |
          mkdir -p site
          shopt -s nullglob
          cached=(site/*.tgz)
          if (( ${#cached[@]} > 0 )); then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Cache hit: ${#cached[@]} cached chart package(s)"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Cache miss: no cached chart packages"
          fi

      - name: Download chart packages from releases
        if: steps.cache-state.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          mapfile -t tags < <(
            gh api --paginate "repos/${repo}/releases" --jq '.[].tag_name'
          )
          if (( ${#tags[@]} > 0 )); then
            printf '%s\n' "${tags[@]}" | xargs -P 8 -I {} \
              gh release download {} \
                --repo "$repo" \
                --pattern '*.tgz' \
                --dir site \
                --clobber || true
          fi

      - name: Add new packages to site
        run: |
          set -euo pipefail
          shopt -s nullglob
          new_packages=(new-packages/*.tgz)
          if (( ${#new_packages[@]} == 0 )); then
            echo "no new chart packages downloaded"
            exit 1
          fi
          cp -f "${new_packages[@]}" site/

      - name: Build chart repository index
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(site/*.tgz)
          if (( ${#packages[@]} == 0 )); then
            echo "no chart packages found"
            exit 1
          fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="${{ github.repository }}"
          url="https://${owner}.github.io/${repo#*/}"
          helm repo index site --url "$url"
          ls -la site

      - name: Save chart package cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/*.tgz
          key: helm-pages-charts-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
